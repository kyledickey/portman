name: Release

# Release with: make release-beta, then make release-stable to promote it.
# A tag with a hyphen, like v0.2.0-beta.1, makes a prerelease.
on:
  push:
    tags: ['v*']

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0 # the notes need the previous tag
      - uses: actions/setup-go@v7
        with:
          go-version-file: go.mod
      - run: make ci
      - run: make dist VERSION="$GITHUB_REF_NAME"
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          tag=$GITHUB_REF_NAME
          prev=$(git describe --tags --abbrev=0 --match 'v*' "$tag^" 2>/dev/null || true)
          git log --format='- %s (%h)' "${prev:+$prev..}$tag" > "$RUNNER_TEMP/notes.md"
          pre=()
          [[ $tag == *-* ]] && pre=(--prerelease)
          gh release create "$tag" dist/* \
            --title "portman ${tag}" --notes-file "$RUNNER_TEMP/notes.md" "${pre[@]}"
